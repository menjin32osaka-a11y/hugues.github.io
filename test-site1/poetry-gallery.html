<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗歌集</title>
<style>
/* ============ RESET & BASE ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family: "PingFang SC","Microsoft YaHei","Noto Serif SC",serif;
  background: #1a1a2e;
  min-height: 100vh;
  color: #e0e0e0;
}
/* ============ HEADER ============ */
.header{
  text-align: center;
  padding: 48px 20px 32px;
}
.header h1{
  font-size: 2.4em;
  font-weight: 300;
  letter-spacing: 0.15em;
  color: #f0e6d3;
  text-shadow: 0 0 30px rgba(200,160,100,0.3);
}
.header p{
  margin-top: 8px;
  font-size: 0.95em;
  color: rgba(200,180,150,0.6);
}
/* ============ SEARCH BAR ============ */
.search-bar{
  display: flex;
  justify-content: center;
  margin-bottom: 36px;
}
.search-bar input{
  width: 320px;
  padding: 10px 20px;
  border-radius: 24px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06);
  color: #e0e0e0;
  font-size: 0.95em;
  outline: none;
  transition: border-color 0.3s, background 0.3s;
}
.search-bar input:focus{
  border-color: rgba(200,160,100,0.5);
  background: rgba(255,255,255,0.1);
}
/* ============ CARD GRID ============ */
.gallery{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 24px;
  padding: 0 40px 60px;
  max-width: 1400px;
  margin: 0 auto;
}
.card{
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94),
              box-shadow 0.35s ease,
              background 0.35s ease;
  border: 1px solid rgba(255,255,255,0.06);
}
.card:hover{
  transform: translateY(-6px);
  box-shadow: 0 16px 40px rgba(0,0,0,0.4);
  background: rgba(255,255,255,0.08);
}
.card-thumb{
  width: 100%;
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.card-thumb .thumb-icon{
  font-size: 3em;
  opacity: 0.8;
  transition: transform 0.3s ease;
}
.card:hover .thumb-icon{ transform: scale(1.1); }
.card-info{
  padding: 14px 16px 16px;
}
.card-info .poem-title{
  font-size: 1.05em;
  font-weight: 500;
  color: #f0e6d3;
  margin-bottom: 4px;
}
.card-info .poem-author{
  font-size: 0.82em;
  color: rgba(200,180,150,0.55);
}
/* ============ OVERLAY (FULLSCREEN DETAIL) ============ */
.overlay{
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.overlay.active{
  opacity: 1;
  pointer-events: all;
}
.overlay-bg{
  position: absolute;
  inset: 0;
}
.overlay-bg canvas{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.overlay-mist{
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%);
  pointer-events: none;
}
.overlay-content{
  max-height: 85vh;
  overflow-y: auto;
  padding-right: 24px;

  position: relative;
  z-index: 2;
  max-width: 720px;
  width: 90%;
  padding: 60px 48px;
  text-align: center;
  animation: fadeInUp 0.6s cubic-bezier(0.22,0.61,0.36,1);
}
@keyframes fadeInUp{
  from{ opacity:0; transform: translateY(40px); }
  to{ opacity:1; transform: translateY(0); }
}
.overlay-close{
  position: absolute;
  top: 28px;
  right: 32px;
  z-index: 3;
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(0,0,0,0.25);
  color: rgba(255,255,255,0.7);
  font-size: 1.2em;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s;
}
.overlay-close:hover{
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: rgba(255,255,255,0.5);
}
.overlay-content .poem-title{
  font-size: 2em;
  font-weight: 400;
  margin-bottom: 8px;
  letter-spacing: 0.08em;
}
.overlay-content .poem-author{
  font-size: 1em;
  opacity: 0.7;
  margin-bottom: 36px;
  letter-spacing: 0.05em;
}
.overlay-content .poem-body{
  font-size: 1.15em;
  line-height: 2.2;
  white-space: pre-line;
  letter-spacing: 0.04em;
  text-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.overlay-content::-webkit-scrollbar { width: 6px; }
.overlay-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <h1>诗歌集</h1>
  <p>一诗一境，步步入画</p>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="搜索诗歌标题或作者...">
</div>

<div class="gallery" id="gallery"></div>

<div class="overlay" id="overlay">
  <button class="overlay-close" id="overlayClose">&times;</button>
  <div class="overlay-bg" id="overlayBg"></div>
  <div class="overlay-mist"></div>
  <div class="overlay-content" id="overlayContent"></div>
</div>

<script>
// ============ PARTICLE SYSTEM BASE ============
class ParticleSystem {
  constructor(containerEl, config) {
    this.container = containerEl;
    this.canvas = document.createElement('canvas');
    this.canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;';
    this.container.appendChild(this.canvas);
    this.ctx = this.canvas.getContext('2d');
    this.particles = [];
    this.animId = null;
    this.config = Object.assign({
      count: 80, minSize: 2, maxSize: 8,
      minSpeed: 0.5, maxSpeed: 2.5,
      swayAmount: 1.5, spawnRate: 0,
    }, config);
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.init();
  }
  resize() {
    this.canvas.width = this.container.clientWidth || window.innerWidth;
    this.canvas.height = this.container.clientHeight || window.innerHeight;
  }
  createParticle() {
    return {
      x: Math.random() * (this.canvas.width || window.innerWidth),
      y: -10 - Math.random() * 100,
      size: this.config.minSize + Math.random() * (this.config.maxSize - this.config.minSize),
      speed: this.config.minSpeed + Math.random() * (this.config.maxSpeed - this.config.minSpeed),
      swayOffset: Math.random() * Math.PI * 2,
      swaySpeed: 0.01 + Math.random() * 0.03,
      opacity: 0.3 + Math.random() * 0.7,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 2,
    };
  }
  init() {
    const w = this.canvas.width || window.innerWidth;
    const h = this.canvas.height || window.innerHeight;
    for (let i = 0; i < this.config.count; i++) {
      const p = this.createParticle();
      p.y = Math.random() * h;
      this.particles.push(p);
    }
  }
  update() {
    const w = this.canvas.width || window.innerWidth;
    const h = this.canvas.height || window.innerHeight;
    this.particles.forEach(p => {
      p.y += p.speed;
      p.swayOffset += p.swaySpeed;
      p.x += Math.sin(p.swayOffset) * this.config.swayAmount;
      p.rotation += p.rotSpeed;
      if (p.y > h + 20) Object.assign(p, this.createParticle());
    });
    if (this.config.spawnRate > 0 && Math.random() < this.config.spawnRate && this.particles.length < this.config.count + 30) {
      this.particles.push(this.createParticle());
    }
  }
  draw() { /* override */ }
  animate() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.update();
    this.draw();
    this.animId = requestAnimationFrame(() => this.animate());
  }
  start() { this.animate(); }
  destroy() {
    if (this.animId) cancelAnimationFrame(this.animId);
    if (this.canvas.parentNode) this.canvas.parentNode.removeChild(this.canvas);
  }
}

// ============ SAKURA SYSTEM ============
class SakuraSystem extends ParticleSystem {
  constructor(containerEl) {
    super(containerEl, { count: 45, minSize: 4, maxSize: 14, minSpeed: 0.4, maxSpeed: 1.6, swayAmount: 2 });
  }
  draw() {
    this.particles.forEach(p => {
      this.ctx.save();
      this.ctx.globalAlpha = p.opacity;
      this.ctx.translate(p.x, p.y);
      this.ctx.rotate(p.rotation * Math.PI / 180);
      const s = p.size;
      for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * Math.PI * 2;
        this.ctx.fillStyle = `rgba(255,${185+Math.random()*30},${210+Math.random()*30},0.85)`;
        this.ctx.beginPath();
        this.ctx.ellipse(Math.cos(angle)*s*0.6, Math.sin(angle)*s*0.6, s*0.5, s*0.25, angle, 0, Math.PI*2);
        this.ctx.fill();
      }
      this.ctx.fillStyle = 'rgba(255,200,210,0.85)';
      this.ctx.beginPath(); this.ctx.arc(0,0,s*0.2,0,Math.PI*2); this.ctx.fill();
      this.ctx.restore();
    });
  }
}

// ============ SNOW SYSTEM ============
class SnowSystem extends ParticleSystem {
  constructor(containerEl) {
    super(containerEl, { count: 120, minSize: 2, maxSize: 6, minSpeed: 0.3, maxSpeed: 1.2, swayAmount: 0.9 });
  }
  draw() {
    this.particles.forEach(p => {
      this.ctx.save();
      this.ctx.globalAlpha = p.opacity;
      this.ctx.fillStyle = 'rgba(255,255,255,0.8)';
      this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); this.ctx.fill();
      this.ctx.restore();
    });
  }
}

// ============ RAIN SYSTEM ============
class RainSystem extends ParticleSystem {
  constructor(containerEl) {
    super(containerEl, { count: 160, minSize: 10, maxSize: 22, minSpeed: 4, maxSpeed: 9, swayAmount: 0.4 });
  }
  draw() {
    this.particles.forEach(p => {
      this.ctx.save();
      this.ctx.globalAlpha = p.opacity;
      this.ctx.strokeStyle = 'rgba(180,200,220,0.4)';
      this.ctx.lineWidth = 0.8;
      this.ctx.beginPath();
      this.ctx.moveTo(p.x, p.y);
      this.ctx.lineTo(p.x - 2, p.y + p.size);
      this.ctx.stroke();
      this.ctx.restore();
    });
  }
}

// ============ FIREFLY SYSTEM ============
class FireflySystem extends ParticleSystem {
  constructor(containerEl) {
    super(containerEl, { count: 25, minSize: 2, maxSize: 5, minSpeed: 0.05, maxSpeed: 0.3, swayAmount: 3.5, spawnRate: 0.006 });
  }
  draw() {
    this.particles.forEach(p => {
      this.ctx.save();
      this.ctx.globalAlpha = p.opacity * (0.5 + 0.5 * Math.sin(Date.now()/1000 + p.swayOffset));
      this.ctx.shadowBlur = 14;
      this.ctx.shadowColor = 'rgba(255,240,120,0.7)';
      this.ctx.fillStyle = 'rgba(255,240,150,0.8)';
      this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); this.ctx.fill();
      this.ctx.restore();
    });
  }
}

// ============ MAPLE SYSTEM ============
class MapleSystem extends ParticleSystem {
  constructor(containerEl) {
    super(containerEl, { count: 30, minSize: 6, maxSize: 18, minSpeed: 0.5, maxSpeed: 1.8, swayAmount: 2.5 });
  }
  draw() {
    const colors = ['rgba(200,80,30,0.85)','rgba(220,140,40,0.8)','rgba(180,60,20,0.75)'];
    this.particles.forEach((p,i) => {
      this.ctx.save();
      this.ctx.globalAlpha = p.opacity;
      this.ctx.translate(p.x, p.y);
      this.ctx.rotate(p.rotation * Math.PI / 180);
      this.ctx.fillStyle = colors[i%3];
      const s = p.size;
      for (let j = 0; j < 5; j++) {
        const angle = (j/5)*Math.PI*2 - Math.PI/2;
        this.ctx.beginPath();
        this.ctx.ellipse(Math.cos(angle)*s*0.55, Math.sin(angle)*s*0.55, s*0.55, s*0.28, angle, 0, Math.PI*2);
        this.ctx.fill();
      }
      this.ctx.fillStyle = 'rgba(140,50,15,0.7)';
      this.ctx.beginPath(); this.ctx.arc(0,0,s*0.18,0,Math.PI*2); this.ctx.fill();
      this.ctx.restore();
    });
  }
}

// ============ STAR SYSTEM ============
class StarSystem extends ParticleSystem {
  constructor(containerEl) {
    super(containerEl, { count: 80, minSize: 0.5, maxSize: 2.5, minSpeed: 0, maxSpeed: 0, swayAmount: 0, spawnRate: 0 });
  }
  init() {
    const w = this.canvas.width || window.innerWidth;
    const h = this.canvas.height || window.innerHeight;
    for (let i = 0; i < this.config.count; i++) {
      this.particles.push({
        x: Math.random() * w,
        y: Math.random() * h * 0.7,
        size: this.config.minSize + Math.random() * (this.config.maxSize - this.config.minSize),
        speed: 0, swayOffset: Math.random() * Math.PI * 2, swaySpeed: 0,
        opacity: 0.4 + Math.random() * 0.6,
        rotation: 0, rotSpeed: 0,
        twinkleSpeed: 0.02 + Math.random() * 0.05,
        twinkleOffset: Math.random() * Math.PI * 2,
      });
    }
  }
  update() {}
  draw() {
    this.particles.forEach(p => {
      this.ctx.save();
      const a = p.opacity * (0.4 + 0.6 * Math.abs(Math.sin(Date.now()/1000 * p.twinkleSpeed + p.twinkleOffset)));
      this.ctx.globalAlpha = a;
      this.ctx.fillStyle = 'rgba(255,255,240,0.9)';
      this.ctx.shadowBlur = 6;
      this.ctx.shadowColor = 'rgba(255,255,200,0.5)';
      this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); this.ctx.fill();
      this.ctx.restore();
    });
  }
}

// ============ FOG SYSTEM ============
class FogSystem extends ParticleSystem {
  constructor(containerEl) {
    super(containerEl, { count: 8, minSize: 150, maxSize: 300, minSpeed: 0.1, maxSpeed: 0.3, swayAmount: 0.5 });
  }
  draw() {
    this.particles.forEach(p => {
      this.ctx.save();
      this.ctx.globalAlpha = p.opacity * 0.15;
      this.ctx.fillStyle = 'rgba(255,255,255,0.5)';
      const grad = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      grad.addColorStop(0, 'rgba(255,255,255,0.4)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      this.ctx.fillStyle = grad;
      this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); this.ctx.fill();
      this.ctx.restore();
    });
  }
}

// ============ POETRY DATA ============
const poems = [

    "atmosphere": "heroic",
    "customBg": "linear-gradient(180deg, #e3dfd8 0%, #c1b3a3 30%, #7d594b 70%, #291712 100%)",

// ============ RENDER CARDS ============
const gallery = document.getElementById('gallery');
const overlay = document.getElementById('overlay');
const overlayBg = document.getElementById('overlayBg');
const overlayContent = document.getElementById('overlayContent');
const overlayClose = document.getElementById('overlayClose');
const searchInput = document.getElementById('searchInput');

let activeParticleSystem = null;

function getThumbIcon(atmosphere) {
  const icons = {
    spring: '🌸', autumn: '🍂', winter: '❄️', summer: '🌿',
    landscape: '⛰️', love: '💕', parting: '🌾', heroic: '⚔️',
    night: '🌙', rain: '🌧️'
  };
  return icons[atmosphere] || '📜';
}

function getThumbBg(atmosphere) {
  const bgs = {
    spring: 'linear-gradient(135deg, #fce4ec, #f8bbd0)',
    autumn: 'linear-gradient(135deg, #ffcc80, #e65100)',
    winter: 'linear-gradient(135deg, #e3f2fd, #90caf9)',
    summer: 'linear-gradient(135deg, #fff9c4, #aed581)',
    landscape: 'linear-gradient(135deg, #dcedc8, #a5d6a7)',
    love: 'linear-gradient(135deg, #f8bbd0, #ce93d8)',
    parting: 'linear-gradient(135deg, #cfd8dc, #78909c)',
    heroic: 'linear-gradient(135deg, #d7ccc8, #8d6e63)',
    night: 'linear-gradient(135deg, #1a237e, #4a148c)',
    rain: 'linear-gradient(135deg, #b0bec5, #546e7a)'
  };
  return bgs[atmosphere] || bgs.landscape;
}

function renderCards(filter = '') {
  const q = filter.toLowerCase();
  const filtered = poems.filter(p =>
    !q || p.title.toLowerCase().includes(q) || p.author.toLowerCase().includes(q)
  );
  gallery.innerHTML = filtered.map((p, i) => `
    <div class="card" data-index="${poems.indexOf(p)}" onclick="openDetail(${poems.indexOf(p)})">
      <div class="card-thumb" style="background:${getThumbBg(p.atmosphere)}">
        <span class="thumb-icon">${getThumbIcon(p.atmosphere)}</span>
      </div>
      <div class="card-info">
        <div class="poem-title">${p.title}</div>
        <div class="poem-author">${p.author}</div>
      </div>
    </div>
  `).join('');
}

// ============ DETAIL OVERLAY ============
function openDetail(index) {
  const p = poems[index];
  if (!p) return;

  // Clear previous particle system
  if (activeParticleSystem) {
    activeParticleSystem.destroy();
    activeParticleSystem = null;
  }
  overlayBg.innerHTML = '';

  // Apply atmosphere-specific styling
  const styles = getAtmosphereStyle(p.atmosphere);
  if (p.customBg) styles.bgStyle = 'background: ' + p.customBg + ';';

  // Populate DOM elements before styling
  overlayContent.innerHTML = '<div class="poem-title"></div><div class="poem-author"></div><div class="poem-body"></div>';

  overlayContent.querySelector('.poem-title').style.cssText = styles.titleStyle;
  overlayContent.querySelector('.poem-author').style.cssText = styles.authorStyle;
  const bodyEl = overlayContent.querySelector('.poem-body');
  const isLightText = ['winter', 'heroic', 'night'].includes(p.atmosphere);
  const shadow = isLightText ? 'text-shadow: 0 1px 8px rgba(0,0,0,0.85), 0 2px 4px rgba(0,0,0,0.9);' : 'text-shadow: 0 1px 8px rgba(255,255,255,0.85), 0 2px 4px rgba(255,255,255,0.9);';
  styles.titleStyle += shadow;
  styles.authorStyle += shadow;
  styles.bodyStyle += shadow;

  bodyEl.style.cssText = styles.bodyStyle;
  bodyEl.textContent = p.content;

  // Set background
  overlayBg.style.cssText = styles.bgStyle;

  // Activate particle system
  const SystemClass = getParticleClass(p.atmosphere);
  if (SystemClass) {
      let configOverride = {};
  if (p.particleCount) configOverride.count = p.particleCount;
  if (p.swayAmount !== undefined) configOverride.swayAmount = p.swayAmount;
  
  activeParticleSystem = new SystemClass(overlayBg);
  Object.assign(activeParticleSystem.config, configOverride);
  activeParticleSystem.particles = [];
  activeParticleSystem.init();
    activeParticleSystem.start();
  }

  // Apply decoration elements
  applyDecorations(overlayBg, p.atmosphere);

  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  overlay.classList.remove('active');
  document.body.style.overflow = '';
  if (activeParticleSystem) {
    activeParticleSystem.destroy();
    activeParticleSystem = null;
  }
  overlayBg.innerHTML = '';
  overlayBg.style.cssText = '';
}

      titleStyle: 'font-family: "STHeiti","SimHei","黑体",sans-serif; font-weight:300; color: #e0e0e0;',
      authorStyle: 'color: #90a4ae;',
      bodyStyle: 'font-family: "STHeiti","SimHei","黑体",sans-serif; font-weight:300; color: #b0bec5; line-height:2.3;'

    rain: {
      bgStyle: 'background: linear-gradient(180deg, #e0e8e8 0%, #b0bec5 30%, #607d8b 70%, #37474f 100%);',

function getParticleClass(atm) {
  const map = {
    spring: SakuraSystem,
    love: SakuraSystem,
    winter: SnowSystem,
    rain: RainSystem,
    parting: RainSystem,
    summer: FireflySystem,
    night: StarSystem,
    autumn: MapleSystem,
    landscape: FogSystem,
    heroic: FogSystem,
  };
  return map[atm] || null;
}

function applyDecorations(container, atm) {
  // Corner decorations as pseudo-element-like divs
  const deco = document.createElement('div');
  deco.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:1;';
  const decorMap = {
    spring: 'bottom:0;left:0;width:180px;height:200px;background:url("data:image/svg+xml,...") no-repeat;',
    winter: 'top:0;right:0;width:120px;height:180px;background:radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.15), transparent 70%);',
    night: 'top:5%;right:8%;width:80px;height:80px;background:radial-gradient(circle, rgba(255,255,200,0.6) 0%, rgba(255,255,200,0.1) 40%, transparent 70%); border-radius:50%; box-shadow: 0 0 60px 20px rgba(255,255,200,0.2);',
  };
  container.appendChild(deco);
}

// ============ EVENT LISTENERS ============
overlayClose.addEventListener('click', closeDetail);
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeDetail();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && overlay.classList.contains('active')) closeDetail();
});
searchInput.addEventListener('input', (e) => renderCards(e.target.value));

// ============ INIT ============
renderCards();
</script>
