<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - GitHub Pages 测试</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="hero">
            <div class="avatar">&#128075;</div>
            <h1>你好，世界</h1>
            <p class="tagline">这是一份部署在 GitHub Pages 上的测试站点。</p>
        </section>

        <section class="cards">
            <div class="card">
                <div class="card-icon">&#9889;</div>
                <h3>纯静态</h3>
                <p>仅 HTML + CSS + JS，无需后端，GitHub Pages 原生支持。</p>
            </div>
            <div class="card">
                <div class="card-icon">&#127760;</div>
                <h3>全球访问</h3>
                <p>部署后获得公开 URL，任何联网设备都能打开。</p>
            </div>
            <div class="card">
                <div class="card-icon">&#128193;</div>
                <h3>免费托管</h3>
                <p>GitHub 免费提供静态站点托管，适合个人项目与原型展示。</p>
            </div>
        </section>

        <section class="cta">
            <button id="testBtn">点我测试交互</button>
            <p id="msg" class="msg"></p>
        </section>

        <footer>
            <p>Powered by <strong>GitHub Pages</strong> &mdash; 部署成功！</p>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
